name: Update live wildfire dashboard

on:
  schedule:
    - cron: "30 5 * * *"   # daily, 05:30 UTC
  workflow_dispatch:        # allow manual runs from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r wildfire-infrastructure-risk/requirements.txt

      - name: Render dashboard from latest FIRMS data
        working-directory: wildfire-infrastructure-risk
        run: python render_static.py --regions iberia --out ../site/wildfire-infrastructure-risk/index.html

      - name: Add landing page
        run: cp pages/index.html site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
