name: Update live wildfire dashboard

on:
  schedule:
    - cron: "30 5 * * *"   # daily, 05:30 UTC
  workflow_dispatch:        # allow manual runs from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build-wildfire.yml
    with:
      runner: ubuntu-latest
      allow-unavailable: true

  retry-build:
    needs: build
    if: needs.build.outputs.ready == 'false'
    uses: ./.github/workflows/build-wildfire.yml
    with:
      # macOS uses a different hosting network from the Azure Linux runners.
      runner: macos-15-intel

  deploy:
    needs: [build, retry-build]
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' &&
          (needs.build.outputs.ready == 'true' ||
           (needs.retry-build.result == 'success' && needs.retry-build.outputs.ready == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
