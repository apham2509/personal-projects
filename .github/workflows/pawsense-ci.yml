name: PawSense CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "pawsense/**"
      - ".github/workflows/pawsense-ci.yml"
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "pawsense/**"
      - ".github/workflows/pawsense-ci.yml"

concurrency:
  group: pawsense-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.8"

defaults:
  run:
    working-directory: pawsense

jobs:
  build-and-test:
    name: Analyse, test, and Android beta APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - name: Install SQLite (host-side Drift tests)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate code (Drift and localisations)
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyse
        run: flutter analyze --no-pub

      - name: Unit, widget, and game tests
        run: flutter test --no-pub

      - name: Android debug build
        run: flutter build apk --debug --no-pub

      - name: Upload installable Android beta
        uses: actions/upload-artifact@v6
        with:
          name: pawsense-android-debug-${{ github.sha }}
          path: pawsense/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  android-integration:
    name: Android tablet integration
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run local database, voice, and live hunt flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_c
          ram-size: 2048M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          working-directory: pawsense
          script: flutter test integration_test/app_flows_test.dart --no-pub -d emulator-5554 --reporter expanded

  ios-build:
    name: iOS device compile (unsigned)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Xcode version
        run: xcodebuild -version

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Compile iOS and native plugins without signing
        run: flutter build ios --release --no-codesign --no-pub
