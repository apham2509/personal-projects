name: pawsense
description: "Personalised digital enrichment and positive-reinforcement training for cats. Local-first, no accounts, no analytics."
publish_to: 'none'

# versionName / CFBundleShortVersionString + versionCode / CFBundleVersion.
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  audioplayers: ^6.8.1
  collection: ^1.19.1
  crypto: ^3.0.7
  csv: ^8.0.0
  cupertino_icons: ^1.0.8
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  fl_chart: ^1.2.0
  flame: ^1.38.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  go_router: ^17.3.0
  image_picker: ^1.2.3
  intl: ^0.20.2
  path_provider: ^2.1.6
  permission_handler: ^13.0.0
  record: ^7.1.1
  share_plus: ^13.3.0
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # Localisation: ARB sources live in lib/l10n, configured via l10n.yaml.
  generate: true

  assets:
    - assets/audio/
